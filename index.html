<!DOCTYPE html>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; scroll-behavior: smooth; }

        .animate-fade { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Teks Overlay Setup */
        .overlay-arabic {
            font-family: 'Amiri', serif;
            font-size: 2.75rem;
            font-weight: 700;
            line-height: 1.8;
            text-align: center;
            color: #ffffff;
            filter: drop-shadow(2px 2px 1px #000) drop-shadow(-1px -1px 0px #000);
            margin-bottom: 0.5rem;
        }

        .arab-word { transition: color 0.15s ease-out; }

        .overlay-latin {
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
            color: #fbbf24;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            margin-bottom: 0.25rem;
        }

        .overlay-translation {
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            margin-bottom: 2rem;
        }

        /* Checkbox & Input */
        .custom-checkbox {
            appearance: none; width: 1.25rem; height: 1.25rem;
            border: 2px solid #4b5563; border-radius: 0.25rem;
            background-color: transparent; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
        }
        .custom-checkbox:checked { background-color: #fbbf24; border-color: #fbbf24; }
        .custom-checkbox:checked::after { content: '✓'; color: #0b0f19; font-weight: bold; font-size: 0.875rem; }

        .dark-input { background-color: #1a1d27; border: 1px solid #374151; color: white; }
        .dark-input:focus { border-color: #fbbf24; outline: none; }

        /* Premium UI Components: Shimmer Skeleton */
        .skeleton {
            background: linear-gradient(90deg, #1a1d27 25%, #2d3748 50%, #1a1d27 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 0.5rem;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Toast Notification */
        #toast-container {
            position: fixed; top: 1rem; left: 50%; transform: translateX(-50%);
            z-index: 50; display: flex; flex-direction: column; gap: 0.5rem;
            pointer-events: none; width: 90%; max-w: 350px;
        }
        .toast {
            background-color: #1f2937; border-left: 4px solid #fbbf24;
            color: white; padding: 0.75rem 1rem; border-radius: 0.375rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); font-size: 0.875rem;
            animation: slideDown 0.3s forwards, fadeOut 0.5s forwards 2.5s;
        }
        .toast.error { border-color: #ef4444; }
        .toast.success { border-color: #10b981; }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

    </style>
</head>

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { if(container.contains(toast)) toast.remove(); }, 3000);
        }

        function safeSaveToCache(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (e) {
                if (e.name === 'QuotaExceededError' || e.code === 22) {
                    for (let i = localStorage.length - 1; i >= 0; i--) {
                        const k = localStorage.key(i);
                        if (k && k.startsWith('QO_DATA_')) { localStorage.removeItem(k); }
                    }
                    try { localStorage.setItem(key, value); } catch(err) {}
                }
            }
        }

        /* =========================================================================
           2. FETCH ENGINE PREMIUM (Multi-API, Retry, Timeout, Cache)
           ========================================================================= */
        async function robustFetchWithCache(endpointId, type, surahNo) {
            const cacheKey = `QO_DATA_${type}_${surahNo || 'ALL'}`;
            
            try {
                const cached = localStorage.getItem(cacheKey);
                if (cached) return JSON.parse(cached);
            } catch(e) {}

            let urls = [];
            if (type === 'surat_list') {
                urls = ['https://equran.id/api/v2/surat', 'https://equran-api.vercel.app/api/v2/surat'];
            } else if (type === 'surat_detail') {
                urls = [
                    `https://equran.id/api/v2/surat/${surahNo}`,
                    `https://equran-api.vercel.app/api/v2/surat/${surahNo}`,
                    `https://api.alquran.cloud/v1/surah/${surahNo}/editions/quran-uthmani,en.transliteration,id.indonesian`
                ];
            } else if (type === 'english') {
                urls = [`https://api.alquran.cloud/v1/surah/${surahNo}/en.asad`];
            }

            const MAX_RETRIES = 2;
            let lastError;

            for (let url of urls) {
                for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
                    try {
                        const fetchPromise = fetch(url, { headers: { 'Accept': 'application/json' }});
                        const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout")), 5000));
                        const res = await Promise.race([fetchPromise, timeoutPromise]);
                        
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        let json = await res.json();
                        if (!json || (!json.data && !json.code)) throw new Error("Data Kosong");
                        
                        if (url.includes('api.alquran.cloud') && type === 'surat_detail') {
                            const alquranData = json.data;
                            if (alquranData && alquranData.length >= 3) {
                                json = {
                                    code: 200, message: "success",
                                    data: {
                                        nomor: parseInt(surahNo),
                                        namaLatin: LOCAL_SURAH_META.find(s => s.nomor === parseInt(surahNo))?.namaLatin || "Surat",
                                        ayat: alquranData[0].ayahs.map((ayah, idx) => {
                                            const globalNum = ayah.number;
                                            return {
                                                nomorAyat: ayah.numberInSurah,
                                                teksArab: ayah.text,
                                                teksLatin: alquranData[1].ayahs[idx].text,
                                                teksIndonesia: alquranData[2].ayahs[idx].text,
                                                audio: {
                                                    '01': `https://cdn.islamic.network/quran/audio/128/ar.abdullahbasfar/${globalNum}.mp3`,
                                                    '02': `https://cdn.islamic.network/quran/audio/128/ar.hudhaify/${globalNum}.mp3`,
                                                    '03': `https://cdn.islamic.network/quran/audio/128/ar.abdurrahmaansudaas/${globalNum}.mp3`,
                                                    '04': `https://cdn.islamic.network/quran/audio/128/ar.shaatree/${globalNum}.mp3`,
                                                    '05': `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${globalNum}.mp3`
                                                }
                                            };
                                        })
                                    }
                                };
                            }
                        }
                        
                        safeSaveToCache(cacheKey, JSON.stringify(json));
                        return json;
                    } catch (err) { lastError = err; }
                }
            }
            throw new Error(lastError ? lastError.message : "Gagal memuat.");
        }

        /* =========================================================================
           3. AUDIO ENGINE PALING JITU (PHYSICAL DOM & SILENT UNLOCK)
           ========================================================================= */
        let surahDataList = LOCAL_SURAH_META; 
        let currentSurahDetail = null;
        let englishTranslationCache = {};

        let audioPlaylist = [];
        let currentAudioIndex = 0;
        let isPlaying = false;
        let wakeLock = null;
        let isPlaylistLoaded = false; // Penanda penting agar audio tidak tumpang tindih
        
        // MENGAMBIL ELEMEN FISIK DARI HTML (Anti dibuang memori oleh iOS)
        const audioPlayer = document.getElementById('core-audio-player');
        
        const QORI_MAP = {
            '01': 'ar.abdullahbasfar', '02': 'ar.hudhaify', '03': 'ar.abdurrahmaansudaas',
            '04': 'ar.shaatree', '05': 'ar.alafasy'
        };

        function getGlobalAyahNumber(surahNum, ayatNum) {
            let globalIndex = 0;
            for (let i = 0; i < surahNum - 1; i++) { globalIndex += LOCAL_SURAH_META[i].jumlahAyat; }
            return globalIndex + ayatNum;
        }

        /* --- NATURAL BUFFERING & GRACEFUL ERROR HANDLING --- */
        // Dihapus fungsi hack base64 unlocker yang justru membuat bentrok state audio.
        // Browser modern hanya butuh 1x klik Play dari user secara langsung.

        audioPlayer.addEventListener('waiting', () => {
            updatePlayButtonIcon('buffer'); 
        });

        audioPlayer.addEventListener('playing', () => {
            updatePlayButtonIcon(true);
        });

        audioPlayer.addEventListener('pause', () => {
            if (!isPlaying) updatePlayButtonIcon(false);
        });

        // Error sejati (bukan loading lambat)
        audioPlayer.onerror = (e) => { 
            if (isPlaying) {
                console.warn("Audio Error Event", e);
                showToast("Gagal memuat audio. Sentuh Play kembali untuk mencoba.", "error");
                resetAudioPlayer();
            }
        };

        const surahSelect = document.getElementById('surah-select');
        const ayatStartInput = document.getElementById('ayat-start');
        const ayatEndInput = document.getElementById('ayat-end');
        const overlayContainer = document.getElementById('quran-overlay');
        const defaultPreview = document.getElementById('default-preview');
        const skeletonLoader = document.getElementById('skeleton-loader');
        const previewContainer = document.getElementById('preview-container');
        const checkIndo = document.getElementById('check-indo');
        const checkEng = document.getElementById('check-eng');
        const bgSelect = document.getElementById('bg-select');
        const qoriSelect = document.getElementById('qori-select');

        // Wake Lock Manager
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {}
        }
        function releaseWakeLock() {
            if (wakeLock !== null) wakeLock.release().then(() => { wakeLock = null; });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderSurahDropdown(LOCAL_SURAH_META);
            restoreState(); 
            robustFetchWithCache('', 'surat_list', null).then(data => {
                surahDataList = data.data; renderSurahDropdown(surahDataList, true); 
            }).catch(e => console.log("Lokal murni"));
        });

        function renderSurahDropdown(list, keepValue = false) {
            const currentVal = surahSelect.value;
            surahSelect.innerHTML = '';
            list.forEach(s => {
                const option = document.createElement('option');
                option.value = s.nomor; option.text = `${s.nomor}. ${s.namaLatin} (${s.jumlahAyat} Ayat)`;
                surahSelect.appendChild(option);
            });
            if (keepValue && currentVal) surahSelect.value = currentVal;
        }

        /* =========================================================================
           4. MANAJEMEN STATE UI LOKAL
           ========================================================================= */
        function saveState() {
            const state = {
                surah: surahSelect.value, start: ayatStartInput.value, end: ayatEndInput.value,
                indo: checkIndo.checked, eng: checkEng.checked, bg: bgSelect.value, qori: qoriSelect.value
            };
            localStorage.setItem('QO_LAST_STATE', JSON.stringify(state));
        }

        function restoreState() {
            try {
                const saved = localStorage.getItem('QO_LAST_STATE');
                if (saved) {
                    const state = JSON.parse(saved);
                    if(state.bg) { bgSelect.value = state.bg; changeBackground(); }
                    if(state.qori) qoriSelect.value = state.qori;
                    if(state.indo !== undefined) checkIndo.checked = state.indo;
                    if(state.eng !== undefined) checkEng.checked = state.eng;
                    if(state.surah) {
                        surahSelect.value = state.surah; updateAyatRange();
                        if(state.start) ayatStartInput.value = state.start;
                        if(state.end) ayatEndInput.value = state.end;
                    }
                }
            } catch(e) {}
        }

        function onSurahChange() { updateAyatRange(); saveState(); }

        function updateAyatRange() {
            const selectedSurahNo = parseInt(surahSelect.value);
            const surahInfo = surahDataList.find(s => s.nomor === selectedSurahNo);
            if(surahInfo) {
                ayatStartInput.value = 1; ayatEndInput.max = surahInfo.jumlahAyat;
                ayatEndInput.value = surahInfo.jumlahAyat > 5 ? 5 : surahInfo.jumlahAyat;
            }
        }

        function setFullSurah() {
            const selectedSurahNo = parseInt(surahSelect.value);
            const surahInfo = surahDataList.find(s => s.nomor === selectedSurahNo);
            if(surahInfo) {
                ayatStartInput.value = 1; ayatEndInput.value = surahInfo.jumlahAyat; saveState();
            }
        }

        function changeBackground() {
            const val = bgSelect.value;
            previewContainer.style.backgroundColor = (val === 'green') ? '#00ff00' : (val === 'blue') ? '#0000ff' : '#000000';
        }

        function changeBackgroundAndSave() { changeBackground(); saveState(); }
        function updateViewAndSave() { saveState(); if(!overlayContainer.classList.contains('hidden')) tampilkanOverlay(); }
        function updateAudioSourceAndSave() { saveState(); updateAudioSource(); }

        /* =========================================================================
           5. CORE LOGIC TAMPILAN & GENERATOR ELEMEN VISUAL
           ========================================================================= */
        function toggleUIState(isLoading) {
            const btn = document.querySelector('button[onclick="tampilkanOverlay()"]');
            if(btn) {
                btn.disabled = isLoading;
                btn.innerHTML = isLoading ? '<span class="animate-pulse">Memuat...</span>' : 'Tampilkan';
            }
            if(isLoading) {
                defaultPreview.classList.add('hidden');
                overlayContainer.classList.add('hidden');
                skeletonLoader.classList.remove('hidden');
            } else {
                skeletonLoader.classList.add('hidden');
            }
        }

        async function tampilkanOverlay() {
            const surahNo = surahSelect.value;
            const start = parseInt(ayatStartInput.value);
            const end = parseInt(ayatEndInput.value);

            if(!surahNo || isNaN(parseInt(surahNo))) { showToast("Pilih surah terlebih dahulu.", "error"); return; }
            if(start > end) { showToast("Ayat mulai tidak boleh lebih besar dari ayat akhir.", "error"); return; }

            saveState();
            toggleUIState(true);
            resetAudioPlayer();

            try {
                showToast("Menyiapkan data ayat...", "success");
                const data = await robustFetchWithCache('', 'surat_detail', surahNo);
                currentSurahDetail = data.data;

                const showEng = checkEng.checked;
                if (showEng) {
                    try {
                        const dataEng = await robustFetchWithCache('', 'english', surahNo);
                        englishTranslationCache[surahNo] = dataEng.data.ayahs;
                    } catch (e) { showToast("Terjemahan English offline.", "error"); }
                }
                
                buildOverlayAndAudio(surahNo, start, end, showEng);
                isPlaylistLoaded = false; // Reset status playlist setiap kali ayat baru dimuat
                skeletonLoader.classList.add('hidden');
                overlayContainer.classList.remove('hidden');

            } catch (err) {
                toggleUIState(false);
                defaultPreview.classList.remove('hidden');
                document.getElementById('default-preview-text').innerText = "Gagal memuat. Mode Offline Aktif.";
                showToast("Gagal: Periksa koneksi internet Anda", "error");
            } finally {
                toggleUIState(false);
            }
        }

        function getBismillahAudioUrl(firstAudio, selectedQori) {
            if (!firstAudio) {
                const identifier = QORI_MAP[selectedQori] || 'ar.abdurrahmaansudaas';
                return `https://cdn.islamic.network/quran/audio/128/${identifier}/1.mp3`;
            }
            let url = firstAudio;
            if (url.includes('islamic.network')) return url.replace(/\/\d+\.mp3$/, '/1.mp3'); 
            else return url.replace(/\d{6}\.mp3$/, '001001.mp3');
        }

        function buildOverlayAndAudio(surahNo, start, end, showEng) {
            const ayatToRender = currentSurahDetail.ayat.filter(a => a.nomorAyat >= start && a.nomorAyat <= end);
            if (ayatToRender.length === 0) throw new Error("Ayat tidak ditemukan");

            const selectedQori = qoriSelect ? qoriSelect.value : '03';
            audioPlaylist = [];
            
            if (surahNo != 9 && !(surahNo == 1 && start == 1)) {
                const firstAudio = (ayatToRender[0] && ayatToRender[0].audio) ? ayatToRender[0].audio[selectedQori] : null;
                const bismillahAudioUrl = getBismillahAudioUrl(firstAudio, selectedQori);
                const secureBismillahUrl = bismillahAudioUrl ? bismillahAudioUrl.replace('http://', 'https://') : '';
                audioPlaylist.push({ src: secureBismillahUrl, nomorAyat: 'bismillah' });
            }
            
            ayatToRender.forEach(a => {
                let audioUrl = (a.audio) ? a.audio[selectedQori] : null;
                if (!audioUrl) {
                    const globalNum = getGlobalAyahNumber(parseInt(surahNo), a.nomorAyat);
                    const identifier = QORI_MAP[selectedQori] || 'ar.abdurrahmaansudaas';
                    audioUrl = `https://cdn.islamic.network/quran/audio/128/${identifier}/${globalNum}.mp3`;
                } else {
                    audioUrl = audioUrl.replace('http://', 'https://');
                }
                audioPlaylist.push({ src: audioUrl, nomorAyat: a.nomorAyat });
            });
            
            currentAudioIndex = 0;
            let htmlContent = '';
            const showIndo = checkIndo.checked;
            let isFirstItem = true;

            if (surahNo != 9 && !(surahNo == 1 && start == 1)) {
                const bismillahDisplayClass = isFirstItem ? 'flex' : 'hidden';
                htmlContent += `<div id="ayat-wrapper-bismillah" class="ayat-wrapper ${bismillahDisplayClass} animate-fade mb-4 w-full flex-col items-center">`;
                htmlContent += `<div class="overlay-arabic" dir="rtl">` +
                               `<span class="arab-word" style="color: #ffffff;">بِسْمِ</span> ` +
                               `<span class="arab-word" style="color: #ffffff;">اللَّهِ</span> ` +
                               `<span class="arab-word" style="color: #ffffff;">الرَّحْمَٰنِ</span> ` +
                               `<span class="arab-word" style="color: #ffffff;">الرَّحِيمِ</span>` +
                               `</div>`;
                htmlContent += `<div class="overlay-latin">Bismillāhir-raḥmānir-raḥīm(i)</div>`;
                if (showIndo) htmlContent += `<div class="overlay-translation" style="margin-bottom: ${showEng ? '0.5rem' : '1rem'}">Dengan nama Allah Yang Maha Pengasih, Maha Penyayang.</div>`;
                if (showEng) htmlContent += `<div class="overlay-translation text-gray-300 italic text-[0.9rem]">In the name of Allah, the Entirely Merciful, the Especially Merciful.</div>`;
                htmlContent += `</div>`;
                isFirstItem = false;
            }

            ayatToRender.forEach((ayat) => {
                const displayClass = isFirstItem ? 'flex' : 'hidden';
                htmlContent += `<div id="ayat-wrapper-${ayat.nomorAyat}" class="ayat-wrapper ${displayClass} animate-fade mb-4 w-full flex-col items-center">`;
                isFirstItem = false;

                const kataArab = (ayat.teksArab + " ۝").split(" ");
                const spanKata = kataArab.map(kata => `<span class="arab-word" style="color: #ffffff;">${kata}</span>`).join(" ");
                
                htmlContent += `<div class="overlay-arabic" dir="rtl">${spanKata}</div>`;
                htmlContent += `<div class="overlay-latin">${ayat.teksLatin}</div>`;
                
                if (showIndo) htmlContent += `<div class="overlay-translation" style="margin-bottom: ${showEng ? '0.5rem' : '1rem'}">${ayat.teksIndonesia}</div>`;
                if (showEng && englishTranslationCache[surahNo]) {
                    const engText = englishTranslationCache[surahNo].find(e => e.numberInSurah === ayat.nomorAyat)?.text || '';
                    htmlContent += `<div class="overlay-translation text-gray-300 italic text-[0.9rem]">${engText}</div>`;
                }
                htmlContent += `</div>`;
            });

            overlayContainer.innerHTML = htmlContent;
        }

        /* =========================================================================
           6. AUDIO ENGINE KONTROL & SINKRONISASI 
           ========================================================================= */
        function updateAudioSource() {
            if(currentSurahDetail && audioPlaylist.length > 0) {
                const selectedQori = qoriSelect.value;
                const start = parseInt(ayatStartInput.value);
                const end = parseInt(ayatEndInput.value);
                const ayatToRender = currentSurahDetail.ayat.filter(a => a.nomorAyat >= start && a.nomorAyat <= end);
                const surahNo = surahSelect.value;
                
                audioPlaylist = [];
                if (surahNo != 9 && !(surahNo == 1 && start == 1)) {
                    const firstAudio = (ayatToRender[0] && ayatToRender[0].audio) ? ayatToRender[0].audio[selectedQori] : null;
                    const bismillahAudioUrl = getBismillahAudioUrl(firstAudio, selectedQori);
                    audioPlaylist.push({ src: bismillahAudioUrl ? bismillahAudioUrl.replace('http://', 'https://') : '', nomorAyat: 'bismillah' });
                }
                
                ayatToRender.forEach(a => {
                    let audioUrl = (a.audio) ? a.audio[selectedQori] : null;
                    if (!audioUrl) {
                        const globalNum = getGlobalAyahNumber(parseInt(surahNo), a.nomorAyat);
                        const identifier = QORI_MAP[selectedQori] || 'ar.abdurrahmaansudaas';
                        audioUrl = `https://cdn.islamic.network/quran/audio/128/${identifier}/${globalNum}.mp3`;
                    }
                    audioPlaylist.push({ src: audioUrl.replace('http://', 'https://'), nomorAyat: a.nomorAyat });
                });

                isPlaylistLoaded = false; // Pastikan status di-reset saat ganti qori
                if (isPlaying) resetAudioPlayer();
            }
        }

        function togglePlay() {
            if (audioPlaylist.length === 0) { showToast("Tampilkan ayat terlebih dahulu", "info"); return; }
            
            if (isPlaying) {
                audioPlayer.pause(); 
                isPlaying = false; 
                updatePlayButtonIcon(false);
                releaseWakeLock();
            } else {
                requestWakeLock();
                isPlaying = true;
                
                if (!isPlaylistLoaded) {
                     isPlaylistLoaded = true;
                     playAyatTrack(currentAudioIndex);
                } else {
                     const promise = audioPlayer.play();
                     if (promise !== undefined) {
                         promise.catch(e => {
                             console.warn("Resume ditolak browser:", e);
                             showToast("Sentuh tombol Play kembali.", "error");
                             isPlaying = false;
                             updatePlayButtonIcon(false);
                         });
                     }
                }
            }
        }

        function playAyatTrack(index) {
            if (index >= audioPlaylist.length) { resetAudioPlayer(); return; }

            const currentTrack = audioPlaylist[index];
            if (!currentTrack || !currentTrack.src) {
                currentAudioIndex++;
                playAyatTrack(currentAudioIndex);
                return;
            }
            
            audioPlayer.src = currentTrack.src;
            // DIBUANG: audioPlayer.load(); -> Pemanggilan load() sebelum play() sering membatalkan koneksi secara paksa di mobile
            
            const playPromise = audioPlayer.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.warn("Track ditolak:", error);
                    isPlaying = false;
                    updatePlayButtonIcon(false);
                    showToast("Browser memblokir audio. Sentuh Play manual.", "info");
                });
            }

            // RESET VISUAL
            document.querySelectorAll('.ayat-wrapper').forEach(el => {
                el.classList.remove('flex'); el.classList.add('hidden');
                el.querySelectorAll('.arab-word').forEach(w => w.style.color = '#ffffff');
            });

            const activeElement = document.getElementById(`ayat-wrapper-${currentTrack.nomorAyat}`);
            if (activeElement) {
                activeElement.classList.remove('hidden'); activeElement.classList.add('flex');
            }
        }

        audioPlayer.addEventListener('ended', () => {
            currentAudioIndex++; playAyatTrack(currentAudioIndex);
        });

        audioPlayer.addEventListener('timeupdate', () => {
            if (audioPlayer.duration) {
                const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                document.getElementById('audio-progress').style.width = `${progressPercent}%`;
                
                const mins = Math.floor(audioPlayer.currentTime / 60);
                const secs = Math.floor(audioPlayer.currentTime % 60);
                document.getElementById('audio-time').innerText = `${mins}:${secs.toString().padStart(2, '0')}`;

                const activeTrack = audioPlaylist[currentAudioIndex];
                if (activeTrack) {
                    const activeWrapper = document.getElementById(`ayat-wrapper-${activeTrack.nomorAyat}`);
                    if (activeWrapper) {
                        const arabicTexts = activeWrapper.querySelectorAll('.overlay-arabic');
                        arabicTexts.forEach(txt => {
                            const words = txt.querySelectorAll('.arab-word');
                            if(words.length > 0) {
                                const activeWordCount = Math.ceil((progressPercent / 100) * words.length);
                                words.forEach((word, index) => {
                                    word.style.color = index < activeWordCount ? '#fbbf24' : '#ffffff';
                                });
                            }
                        });
                    }
                }
            }
        });

        function resetAudioPlayer() {
            audioPlayer.pause(); 
            isPlaying = false; 
            currentAudioIndex = 0; 
            isPlaylistLoaded = false;
            updatePlayButtonIcon(false); releaseWakeLock();
            document.getElementById('audio-progress').style.width = '0%';
            document.getElementById('audio-time').innerText = '0:00';
            
            if (audioPlaylist.length > 0) {
                document.querySelectorAll('.ayat-wrapper').forEach((el, idx) => {
                    if(idx === 0) { el.classList.remove('hidden'); el.classList.add('flex'); }
                    else { el.classList.remove('flex'); el.classList.add('hidden'); }
                    el.querySelectorAll('.arab-word').forEach(w => w.style.color = '#ffffff');
                });
            }
        }

        function updatePlayButtonIcon(status) {
            const btn = document.getElementById('play-btn');
            if (status === 'buffer') {
                btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            } else if (status === true || status === 'pause') {
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-black" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>`;
            } else {
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-black ml-1" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" /></svg>`;
            }
        }
    </script>
</body>
</html>
